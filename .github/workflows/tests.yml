name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AGORA_DATA_DIR: ${{ github.workspace }}/.agora-ci/data
      AGORA_CONFIG_DIR: ${{ github.workspace }}/.agora-ci/config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -c requirements-lock.txt
      - run: python -m pip check
      - run: python -m pytest -m "not local_llm"
      - run: python scripts/render_smoke.py
      - run: python scripts/live_smoke.py --provider mock --compare
